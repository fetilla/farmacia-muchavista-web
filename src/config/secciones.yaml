# Textos de cada sección de la página.
#
# Campos disponibles en cada sección (todos opcionales salvo "titulo"):
#   menu:         texto del enlace en el menú (en "contacto", texto del botón de la cabecera)
#   antetitulo:   línea pequeña encima del título
#   titulo:       título principal de la sección
#   subtitulo:    frase de apoyo bajo el título
#   parrafos:     lista de párrafos
#   lema:         frase corta destacada en grande (Nosotros)
#   descripcion_seo: texto para Google y al compartir la web (solo Inicio)
#   tarjetas:     lista de tarjetas { titulo, texto, icono, etiqueta, fecha, detalle, descuento, precio, enlace }
#                 detalle (opcional): { titulo, texto } añade un botón "Más información"
#                 descuento (opcional): texto destacado, p. ej. "-20 %"
#                 precio (opcional): { antes, ahora } muestra el precio anterior tachado
#                 enlace (opcional): { texto, seccion, categoria, marca } enlace a otra sección
#                   (con "categoria", abre Marcas con ese filtro; con "marca", lleva a esa marca
#                   en el carrusel y muestra su descripción)
#   nota:         texto pequeño bajo las tarjetas (p. ej. condiciones de las promociones)
#                 icono: nombre de un icono de Phosphor (https://phosphoricons.com), p. ej. "heartbeat"
#   video:        tramo del vídeo de fondo en segundos { desde, hasta }
#   provisional:  true mientras el texto sea de ejemplo (se marca en desarrollo)
#
# El orden de este fichero es el orden del menú y del recorrido.

inicio:
  menu: "Inicio"
  antetitulo: "Farmacia en Playa Muchavista, El Campello"
  titulo: "Tu farmacia de confianza, a un paso de la playa"
  subtitulo: "Consejo farmacéutico cercano, servicios, dermofarmacia y cuidado para toda la familia."
  descripcion_seo: "Farmacia Muchavista en Playa Muchavista, El Campello. Consejo farmacéutico cercano, servicios, dermofarmacia, control de tensión y cuidado para toda la familia."
  video: { desde: 0, hasta: 5.04 }
  provisional: true

servicios:
  menu: "Servicios"
  antetitulo: "Servicios"
  titulo: "Todo lo que necesitas, en un solo sitio"
  subtitulo: "Te ayudamos a resolver dudas de salud del día a día sin esperas ni citas complicadas."
  tarjetas:
    - titulo: "Consejo farmacéutico"
      texto: "Resolvemos tus dudas sobre medicación, interacciones y pequeñas dolencias con tiempo para escucharte."
      icono: "chat-circle-text"
    - titulo: "Dermofarmacia"
      texto: "Analizamos tu piel y te recomendamos una rutina de dermofarmacia adaptada, también para después del sol."
      icono: "sparkle"
    - titulo: "Control de tensión"
      texto: "Medimos tu tensión arterial en nuestra cabina y te explicamos los resultados al momento."
      icono: "heartbeat"
      detalle:
        titulo: "Seguimiento de Tensión Arterial, Pulso y Detección de Arritmias"
        texto: "Medición rigurosa siguiendo las directrices de Guías clínicas especializadas como la Guía ESC 2024, Guía AHA/ACC. Se realiza mediante el dispositivo de última generación Omron X7 Smart Afib (clínicamente validado), manguitos adaptados y un reposo previo de 5 minutos en un entorno tranquilo para evitar sesgos. Tras varias tomas válidas, se elabora un informe personalizado con tus valores, pautas de ejercicio y recomendaciones nutricionales para cuidar de tu corazón."
    - titulo: "Nutrición y bienestar"
      texto: "Te orientamos con complementos y hábitos para el descanso, la digestión y las defensas."
      icono: "leaf"
    - titulo: "Zona infantil"
      texto: "Alimentación, higiene y cuidado del bebé con asesoramiento para madres y padres primerizos."
      icono: "baby"
    - titulo: "Botiquín de playa"
      texto: "Picaduras, quemaduras solares o pequeñas heridas: te preparamos lo necesario para tus vacaciones."
      icono: "first-aid-kit"
  video: { desde: 5.04, hasta: 10.08 }
  provisional: true

