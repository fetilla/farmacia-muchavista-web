    - "Elena Pérez Belda y su equipo combinan formación sanitaria continua con algo que no se aprende en los libros: el trato de una farmacia de barrio."
  frase_destacada: "Cuidamos de tu salud con la cercanía de siempre y el rigor de un equipo sanitario."
  video: { desde: 5.04, hasta: 10.08 }
  provisional: true

